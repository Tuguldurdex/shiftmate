<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="shift_mate">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ShiftMate - Smart Shift Management</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Prevent white screen flash
    document.body.style.backgroundColor = '#F4F3FF';
  </script>
</head>
<body>
  <!-- Loading indicator to prevent white screen -->
  <div id="loading-indicator" style="display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; font-family: Inter, sans-serif;">
    <div style="width: 40px; height: 40px; border: 4px solid #E2E8F0; border-top: 4px solid #534AB7; border-radius: 50%; animation: spin 1s linear infinite;"></div>
    <p style="margin-top: 16px; color: #64748B;">Loading ShiftMate...</p>
  </div>
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <script>
    // Flutter loader configuration
    window.addEventListener('load', function(ev) {
      // Remove loading indicator once Flutter is ready
      if (window.flutterWebRenderer) {
        document.getElementById('loading-indicator').style.display = 'none';
      }
    });

    // Service worker fix for some hosting providers
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>

  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
